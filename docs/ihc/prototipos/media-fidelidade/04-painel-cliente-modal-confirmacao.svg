 Mendes · Eletrica · execucao registrada em 25/11/2026</text><rect x="280" y="604" width="440" height="40" rx="8" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1"/><text x="294" y="629" font-size="12" font-weight="normal" fill="#616161" text-anchor="start">O servico nao saiu como combinado? Use "Contestar".</text><text x="280" y="669" font-size="10.5" font-weight="bold" fill="#9e9e9e" text-anchor="start">QUANTO VOCÊ PAGOU PELO SERVIÇO?</text><rect x="280" y="676" width="440" height="40" rx="6" fill="#fff" stroke="#bdbdbd"/><text x="292" y="701.0" font-size="13" font-weight="normal" fill="#bdbdbd" text-anchor="start">0,00</text><text x="280" y="736" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="start">Se for diferente do valor registrado pelo profissional, a conclusao</text><text x="280" y="754" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="start">volta para ele revisar e nenhuma comissao e cobrada.</text><text x="280" y="786" font-size="14" font-weight="bold" fill="#212121" text-anchor="start">Ao confirmar com o mesmo valor</text><text x="280" y="806" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="start">• O servico passa para Concluida e voce podera avaliar.</text><text x="280" y="824" font-size="11.5" font-weight="normal" fill="#616161" text-anchor="start">• Comissao de 10% sobre o valor do servico ao profissional.</text><rect x="280" y="844" width="440" height="36" rx="8" fill="#e0e0e0" stroke="#e0e0e0" stroke-width="1"/><text x="294" y="867" font-size="12" font-weight="normal" fill="#212121" text-anchor="start">Voce tem ate 02/12/2026 14:40 para responder.</text><rect x="470" y="892" width="100" height="36" rx="6" fill="#fff" stroke="#bdbdbd"/><text x="520.0" y="915.0" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">Voltar</text><rect x="580" y="892" width="140" height="36" rx="6" fill="#424242" stroke="#424242"/><text x="650.0" y="915.0" font-size="13" font-weight="bold" fill="#fff
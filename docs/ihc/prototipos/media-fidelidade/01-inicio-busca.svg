perto de voce</text><text x="60" y="248" font-size="15" font-weight="normal" fill="#fff" text-anchor="start">Eletricista, encanador, pintor, diarista e jardineiro — por categoria e regiao.</text><rect x="60" y="276" width="880" height="96" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="80" y="309" font-size="10.5" font-weight="bold" fill="#9e9e9e" text-anchor="start">CATEGORIA</text><rect x="80" y="316" width="210" height="40" rx="6" fill="#fff" stroke="#bdbdbd"/><text x="92" y="341.0" font-size="13" font-weight="normal" fill="#424242" text-anchor="start">Selecione uma categoria</text><text x="272" y="341.0" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">▾</text><text x="305" y="309" font-size="10.5" font-weight="bold" fill="#9e9e9e" text-anchor="start">CIDADE</text><rect x="305" y="316" width="210" height="40" rx="6" fill="#fff" stroke="#bdbdbd"/><text x="317" y="341.0" font-size="13" font-weight="normal" fill="#424242" text-anchor="start">Todas as cidades</text><text x="497" y="341.0" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">▾</text><text x="530" y="309" font-size="10.5" font-weight="bold" fill="#9e9e9e" text-anchor="start">BAIRRO</text><rect x="530" y="316" width="210" height="40" rx="6" fill="#fff" stroke="#bdbdbd"/><text x="542" y="341.0" font-size="13" font-weight="normal" fill="#424242" text-anchor="start">Todos os bairros</text><text x="722" y="341.0" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">▾</text><rect x="760" y="316" width="160" height="40" rx="6" fill="#424242" stroke="#424242"/><text x="840.0" y="341.0" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Buscar profissionais</text><text x="60" y="412" font-size="13" font-weight="normal" fill="#fff" text-anchor="start">✓  Buscar, ver perfis e solicitar nao custa nada — voce nao precisa de conta para buscar.</text><text x="60" y="528" font-size="22" font-weight="bold" fill="#212121" text-anchor="start">Como funciona</text><text x="60" y="552" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">Tres passos — e a cobranca so acontece depois do ultimo.</text><rect x="60" y="570" width="280" height="100" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="76" y="602" font-size="15" font-weight="bold" fill="#212121" text-anchor="start">1  Busque</text><text x="76" y="628" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">Filtre por categoria e bairro, e compare ava</text><text x="76" y="646" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">liacoes.</text><rect x="357" y="570" width="280" height="100" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="373" y="602" font-size="15" font-weight="bold" fill="#212121" text-anchor="start">2  Solicite</text><text x="373" y="628" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">O profissional aceita e voces trocam contato</text><text x="373" y="646" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">, sem custo.</text><rect x="654" y="570" width="280" height="100" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="670" y="602" font-size="15" font-weight="bold" fill="#212121" text-anchor="start">3  Confirme</text><text x="670" y="628" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">So depois da sua confirmacao o profissional </text><text x="670" y="646" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">paga a comissao.</text><rect x="60" y="686" width="880" height="50" rx="8" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1"/><text x="80" y="716" font-size="13" font-weight="normal" fill="#616161" text-anchor="start">Aqui o profissional so paga 10% de comissao quando voce confirma a conclusao.</text><rect x="790" y="692" width="136" height="38" rx="6" fill="#fff" stroke="#bdbdbd"/><text x="858.0" y="716.0" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">Sou profissional</text></g><text x="12" y="776" font-size="11" font-weight="normal" fill="#777" text-anchor="start">Media fidelidade — Início e busca</text></svg>

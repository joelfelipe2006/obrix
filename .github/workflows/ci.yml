name: CI de regressão

on:
  pull_request:
  push:
    branches: [main]

jobs:
  regressao:
    name: Testes de regressão
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes do back-end (JUnit 5 + JaCoCo)
        run: mvn -B clean test

      - name: Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Testes do front-end (node:test)
        run: node --test src/test/js/*.test.js

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco
          if-no-files-found: warn

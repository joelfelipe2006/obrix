# Perfil usado pelos testes de integracao.
# Banco H2 proprio, sem os dados de demonstracao do perfil dev: cada teste
# cria pela API os usuarios e solicitacoes de que precisa.
spring:
  datasource:
    url: jdbc:h2:mem:obrix-teste;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

logging:
  level:
    br.com.obrix: WARN

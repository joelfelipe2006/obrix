spring:
  application:
    name: obrix
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    # O mapper monta a resposta no controller, fora do service: a sessao do
    # Hibernate precisa continuar aberta ate o fim da requisicao.
    open-in-view: true
    properties:
      hibernate.format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8080
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: false

obrix:
  comissao:
    percentual: 10.00
  confirmacao:
    prazo-dias: 7

logging:
  level:
    br.com.obrix: INFO
